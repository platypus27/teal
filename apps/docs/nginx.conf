server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-CoN8jxbuA6X0UuD33yknfEEAf1gEr6W+oaFJbwKll1k=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Hashed assets live under each version prefix and are immutable.
    location ~ "^/(?<ver>[0-9]+\.[0-9]+\.[0-9]+)/assets/" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Each version is an SPA rooted at its own prefix; unknown paths fall back
    # to that version's index so deep links survive a refresh.
    location ~ "^/(?<ver>[0-9]+\.[0-9]+\.[0-9]+)(?<rest>/|$)" {
        try_files $uri $uri/ /$ver/index.html;
        expires -1;
    }

    # Root: the entrypoint-generated version index (with a redirect to latest).
    location = / {
        try_files /index.html =404;
        expires -1;
    }
}
