name: Pipeline

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Pull requests cancel stale runs. Master validation and deployment use job-specific
# groups, while release runs are never cancelled halfway through a publish.
concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: pipeline-quality-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 # zizmor: ignore[adhoc-packages] exact npm bootstrap precedes lockfile operations
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run lint
      - run: npm run build --workspace @kryv/teal
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integrity
      - run: npm run check:generated
      - run: npm run build
      - run: npm run install:browser --workspace @kryv/teal-docs -- --with-deps chromium
      - run: npm run pack:verify

  browser:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium, firefox, webkit]
    concurrency:
      group: pipeline-browser-${{ github.event_name }}-${{ github.ref }}-${{ matrix.project }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 # zizmor: ignore[adhoc-packages] exact npm bootstrap precedes lockfile operations
      - run: npm ci
      - name: Install exact browser project
        env:
          BROWSER_INSTALL_PROJECT: ${{ matrix.project == 'mobile-chromium' && 'chromium' || matrix.project }}
        run: npm run install:browser --workspace @kryv/teal-docs -- --with-deps "$BROWSER_INSTALL_PROJECT"
      - run: npm run build --workspace @kryv/teal
      - name: Test exact browser project
        env:
          BROWSER_TEST_PROJECT: ${{ matrix.project }}
        run: npm run test:e2e --workspace @kryv/teal-docs -- --project="$BROWSER_TEST_PROJECT"

  lighthouse:
    name: Lighthouse
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pipeline-lighthouse-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 # zizmor: ignore[adhoc-packages] exact npm bootstrap precedes lockfile operations
      - run: npm ci
      - run: npm run build
      - run: npm run lighthouse --workspace @kryv/teal-docs

  production_image:
    name: Production documentation image
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: pipeline-production-image-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.19.0 # zizmor: ignore[adhoc-packages] exact npm bootstrap precedes lockfile operations
      - run: npm ci --ignore-scripts
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/docs/Dockerfile
          load: true
          push: false
          tags: teal-docs:verify-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Verify exact production image
        env:
          VERIFY_IMAGE: teal-docs:verify-${{ github.sha }}
        run: >-
          npm run verify:docs-image --
          --image "$VERIFY_IMAGE"
          --revision "${GITHUB_SHA}"
          --source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --temporary-root "${RUNNER_TEMP}"

  release_plan:
    name: Plan release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [quality, browser, lighthouse, production_image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0 # zizmor: ignore[adhoc-packages] exact npm bootstrap precedes lockfile operations
      - run: npm ci --ignore-scripts
      - run: npm run create:release-package
      - name: Determine release mode
        id: plan
        run: |
          set -euo pipefail
          mode="$(npm run --silent plan:release)"
          case "$mode" in
            version|publish|reconcile|none) ;;
            *) echo "::error::Invalid release mode: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release mode: $mode"

  release_version:
    name: Version release
    if: ${{ github.repository == 'platypus27/teal' && github.event_name == 'push' && github.ref == 'refs/heads/master' && github.ref_protected == true && needs.release_plan.outputs.mode == 'version' }}
    needs: release_plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pipeline-release-version-master
      cancel-in-progress: false
    permissions:
      contents: write # Changesets creates the exact version commit and branch.
      pull-requests: write # Changesets opens or updates the version pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 # zizmor: ignore[adhoc-packages] exact npm bootstrap precedes lockfile operations
      - run: npm ci --ignore-scripts
      - uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: npm run release:version
          createGithubReleases: false
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  release_candidate:
    name: Attested release candidate
    if: >-
      ${{
        github.event_name == 'push' &&
        github.repository == 'platypus27/teal' &&
        github.ref == 'refs/heads/master' &&
        github.ref_protected == true
      }}
    needs: [quality, browser, lighthouse, production_image]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      attestations: write # Publish provenance for the exact candidate manifest.
      artifact-metadata: write # Associate the retained candidate with its workflow run.
      contents: read
      id-token: write # Obtain the GitHub OIDC identity used to sign provenance.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0 # zizmor: ignore[adhoc-packages] exact npm bootstrap precedes lockfile operations
      - run: npm ci --ignore-scripts
      - run: npm run install:browser --workspace @kryv/teal-docs -- chromium
      - name: Retain exact npm artifact
        run: npm run verify:release-package
      - name: Build exact documentation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/docs/Dockerfile
          load: true
          push: false
          tags: teal-docs:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Retain exact image, SBOM, and scan receipts
        run: >-
          npm run verify:docs-image --
          --image "teal-docs:candidate-${GITHUB_SHA}"
          --revision "${GITHUB_SHA}"
          --source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --temporary-root "${RUNNER_TEMP}"
          --descriptor .release/docs/artifact.json
          --repository ghcr.io/platypus27/teal/teal-docs
      - name: Build fixed production controller
        run: node scripts/build_production_controller.mjs --output .release/kryv-teal-production-controller.tar
      - name: Retain exact source closure
        run: |
          set -euo pipefail
          install -d -m 0700 .release/source
          git bundle create .release/source/repository.bundle HEAD
          git bundle verify .release/source/repository.bundle
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Assemble and verify complete candidate
        run: |
          set -euo pipefail
          for evidence in \
            .release/docs/docs-image.tar \
            .release/docs/docs-image.sbom.cdx.json \
            .release/docs/docs-image.vulnerability.json \
            .release/docs/docs-image.secret.json; do
            test -f "$evidence"
          done
          created_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          node scripts/assemble-release-candidate.mjs \
            --candidate-root .release/candidate \
            --controller-archive .release/kryv-teal-production-controller.tar \
            --created-at "$created_at" \
            --deployment-model deploy.docs.yml \
            --docs-root .release/docs \
            --npm-root .release/npm \
            --source-bundle .release/source/repository.bundle \
            --source-commit "$GITHUB_SHA" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-run-id "$GITHUB_RUN_ID" \
            --workspace-root "$GITHUB_WORKSPACE"
          node scripts/teal_release_candidate.mjs verify \
            --root .release/candidate \
            --repository "$GITHUB_REPOSITORY" \
            --workflow platypus27/teal/.github/workflows/pipeline.yml \
            --ref "$GITHUB_REF" \
            --source-commit "$GITHUB_SHA" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Attest exact candidate manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: .release/candidate/candidate-manifest.json
      - name: Upload complete candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teal-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/candidate
          if-no-files-found: error
          retention-days: 30
