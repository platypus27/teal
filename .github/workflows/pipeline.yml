name: Pipeline

on:
  pull_request:
  push:
    branches: [master]

# Pull requests cancel stale runs. Master validation and deployment use job-specific
# groups, while release runs are never cancelled halfway through a publish.
concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-quality-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build --workspace @kryv/teal
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run check:generated
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run pack:verify

  browser:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium, firefox, webkit]
    concurrency:
      group: pipeline-browser-${{ github.event_name }}-${{ github.ref }}-${{ matrix.project }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chromium' && 'chromium' || matrix.project }}
      - run: npm run build --workspace @kryv/teal
      - run: npm run test:e2e --workspace @kryv/teal-docs -- --project=${{ matrix.project }}

  lighthouse:
    name: Lighthouse
    needs: quality
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-lighthouse-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx @lhci/cli@0.14.0 autorun --config=lighthouserc.cjs

  release:
    name: Release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [quality, browser, lighthouse]
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-release-master
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.5.1
      - run: npm ci
      # The packed tarball must contain packages/teal/dist (see "files" in its
      # package.json); without this build the release publishes src/ only.
      - run: npm run build --workspace @kryv/teal
      - name: Determine whether a release is needed
        id: release-plan
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/teal/package.json').version")"
          published=false
          registry_error=$(mktemp)
          trap 'rm -f "$registry_error"' EXIT
          if npm view "@kryv/teal@$version" version >/dev/null 2>"$registry_error"; then
            published=true
          elif ! grep -qiE 'E404|404 Not Found|is not in this registry' "$registry_error"; then
            cat "$registry_error" >&2
            exit 1
          fi
          has_changesets=false
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            has_changesets=true
          fi
          if [ "$has_changesets" = true ] || [ "$published" = false ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Release required: package=$version published=$published changesets=$has_changesets"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No release required: package=$version published=$published"
          fi
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        if: steps.release-plan.outputs.run == 'true'
        with:
          version: npm run release:version
          # Use changeset publish (not publish:package) so the action detects the
          # published packages and creates the GitHub release; provenance still
          # applies via NPM_CONFIG_PROVENANCE.
          publish: npx changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  documentation:
    name: Documentation image and deploy
    # Set the repository variable DOCS_DEPLOY_ENABLED=true after configuring the
    # deployment secrets below. Until then this job is intentionally skipped.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DOCS_DEPLOY_ENABLED == 'true' }}
    needs: [quality, browser, lighthouse]
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-documentation-master
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment configuration
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DOCS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DOCS_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DOCS_DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DOCS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required docs deployment secret: $name"
              exit 1
            fi
          done
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/teal-docs:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/docs/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DOCS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Pull immutable image and roll out
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DEPLOY_HOST: ${{ secrets.DOCS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DOCS_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DOCS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          image_arg="$(printf '%q' "$IMAGE")"
          deploy_path_arg="$(printf '%q' "$DEPLOY_PATH")"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "IMAGE=$image_arg DEPLOY_PATH=$deploy_path_arg bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          previous="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q docs)" 2>/dev/null || true)"
          export TEAL_DOCS_IMAGE="$IMAGE"
          docker compose pull docs
          docker compose up -d --no-build docs
          if ! curl --fail --retry 12 --retry-delay 2 --silent http://127.0.0.1:8087/ >/dev/null; then
            if [ -n "$previous" ]; then
              export TEAL_DOCS_IMAGE="$previous"
              docker compose up -d --no-build docs
            fi
            exit 1
          fi
          REMOTE
