version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    cooldown:
      default-days: 7
      semver-major-days: 30
    # Version and security updates cannot share a group, so each dependency
    # type gets one rule set per update kind. Without the security groups every
    # advisory-driven bump (often a transitive package) opens its own PR.
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
      development:
        applies-to: version-updates
        dependency-type: development
      production-security:
        applies-to: security-updates
        dependency-type: production
      development-security:
        applies-to: security-updates
        dependency-type: development
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    # Actions have no dev/prod split; batch every pin bump into one PR.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /apps/docs
    cooldown:
      default-days: 7
    # The node image major follows the engines pin (Node 24). A move to a new
    # Node major happens across the Kryv ecosystem at once, not in one image.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
