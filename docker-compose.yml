services:
  docs:
    image: ${TEAL_DOCS_IMAGE:-ghcr.io/platypus27/teal-docs:local}
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    user: '101:101'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    ports:
      - '127.0.0.1:8087:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
